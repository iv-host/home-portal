server:
  forward-headers-strategy: FRAMEWORK

spring:
  liquibase:
    enabled: true
    change-log: classpath:/database/db.changelog-root.yml

  servlet.multipart:
    max-file-size: 100MB
    max-request-size: 100MB

  datasource:
    url: jdbc:postgresql://localhost:5432/home
    username: home
    password: password

security:
  oauth2:
    enabled: true
    admin-role: admin
    issuer-url: http://localhost:8081/realms/home-portal
    jwks-url: http://localhost:8081/realms/home-portal/protocol/openid-connect/certs
    client:
      authorization-url: http://localhost:8081/realms/home-portal/protocol/openid-connect/auth
      token-url: http://localhost:8081/realms/home-portal/protocol/openid-connect/token
      client-id: home-portal
      client-secret: home-portal-dev-secret
      scope: ~

    # Comma separated list of allowed referrers.
    referrers: http://localhost:8080

springdoc:
  api-docs:
    resolve-schema-properties: true
  writer-with-order-by-keys: true



logging:
  level:
    httpclient.wire: DEBUG
    org.springframework: WARN
    org.ivcode: DEBUG